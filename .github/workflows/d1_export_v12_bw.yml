name: D1 export v12 Elo + bodyweight

# SELECT only. Pages by month. Artifact CSV for replica join.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'audit'
        required: false
        default: 'v12+bw join for official-gate replay'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Probe columns + coverage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/d1x
          npx wrangler d1 execute tianxi-db --remote --json --command "PRAGMA table_info(horse_form_records)" > /tmp/d1x/pragma_hfr.json
          npx wrangler d1 execute tianxi-db --remote --json --command "PRAGMA table_info(race_results)" > /tmp/d1x/pragma_rr.json
          npx wrangler d1 execute tianxi-db --remote --json --command "PRAGMA table_info(races)" > /tmp/d1x/pragma_races.json
          npx wrangler d1 execute tianxi-db --remote --json --command "SELECT COUNT(*) n, COUNT(declared_weight) w FROM horse_form_records WHERE race_date>='2024-09-01' AND race_date<='2026-07-16'" > /tmp/d1x/cov_hfr.json
          npx wrangler d1 execute tianxi-db --remote --json --command "SELECT COUNT(*) n, COUNT(declared_weight) w FROM race_results rr JOIN races r ON r.id=rr.race_id JOIN race_meetings rm ON rm.id=r.meeting_id WHERE rm.date>='2024-09-01' AND rm.date<='2026-07-16'" > /tmp/d1x/cov_rr.json
          npx wrangler d1 execute tianxi-db --remote --json --command "SELECT track, COUNT(*) n FROM races r JOIN race_meetings rm ON rm.id=r.meeting_id WHERE rm.date>='2024-09-01' AND rm.date<='2026-07-16' GROUP BY track" > /tmp/d1x/track_counts.json
          cat /tmp/d1x/cov_hfr.json /tmp/d1x/cov_rr.json /tmp/d1x/track_counts.json
      - name: Page monthly dumps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, subprocess, os, calendar
          months = []
          for y,m in [(2024,6),(2024,7),(2024,8),(2024,9),(2024,10),(2024,11),(2024,12),
                      (2025,1),(2025,2),(2025,3),(2025,4),(2025,5),(2025,6),(2025,7),(2025,8),(2025,9),(2025,10),(2025,11),(2025,12),
                      (2026,1),(2026,2),(2026,3),(2026,4),(2026,5),(2026,6),(2026,7)]:
              last = calendar.monthrange(y,m)[1]
              months.append((f'{y}-{m:02d}-01', f'{y}-{m:02d}-{last:02d}', f'{y}{m:02d}'))
          def run(sql, out):
              print('SQL', sql[:120], '->', out)
              r = subprocess.run(
                  ['npx','wrangler','d1','execute','tianxi-db','--remote','--json','--command', sql],
                  capture_output=True, text=True)
              open(out,'w').write(r.stdout or r.stderr)
              if r.returncode != 0:
                  print('FAIL', r.stderr[-400:])
              else:
                  print('ok', out, 'bytes', len(r.stdout or ''))
          os.makedirs('/tmp/d1x/pages', exist_ok=True)
          for a,b,tag in months:
              run(
                f"SELECT horse_id, race_date, venue, race_number, declared_weight, actual_weight, race_id FROM horse_form_records WHERE race_date>='{a}' AND race_date<='{b}'",
                f'/tmp/d1x/pages/hfr_{tag}.json')
              run(
                f"SELECT horse_id, as_of_date, rating, games_played FROM horse_elo_snapshots WHERE axis_key='overall' AND CAST(id AS TEXT) LIKE 'v12:%' AND as_of_date>='{a}' AND as_of_date<='{b}'",
                f'/tmp/d1x/pages/helo_{tag}.json')
              run(
                f"SELECT jockey_id, as_of_date, rating FROM jockey_elo_snapshots WHERE CAST(id AS TEXT) LIKE 'v12:%' AND as_of_date>='{a}' AND as_of_date<='{b}'",
                f'/tmp/d1x/pages/jelo_{tag}.json')
              run(
                f"SELECT trainer_id, as_of_date, rating FROM trainer_elo_snapshots WHERE CAST(id AS TEXT) LIKE 'v12:%' AND as_of_date>='{a}' AND as_of_date<='{b}'",
                f'/tmp/d1x/pages/telo_{tag}.json')
          run(
            "SELECT r.id AS race_id, rm.date AS race_date, rm.venue, r.race_number, r.track, r.course, r.going FROM races r JOIN race_meetings rm ON rm.id=r.meeting_id WHERE rm.date>='2024-09-01' AND rm.date<='2026-07-16'",
            '/tmp/d1x/pages/races.json')
          PY
      - name: Flatten JSON pages to CSV
        run: |
          python3 <<'PY'
          import json, csv, glob, os
          from pathlib import Path
          def rows_of(path):
              raw=json.loads(Path(path).read_text() or '[]')
              if isinstance(raw, dict) and 'error' in raw:
                  print('ERR', path, raw.get('error'))
                  return []
              blocks = raw if isinstance(raw, list) else [raw]
              out=[]
              for b in blocks:
                  out.extend(b.get('results') or [])
              return out
          def write_csv(pattern, dest, fields=None):
              rows=[]
              for p in sorted(glob.glob(pattern)):
                  part=rows_of(p)
                  print(p, len(part))
                  rows.extend(part)
              if not rows:
                  print('empty', dest); return 0
              fields = fields or list(rows[0].keys())
              with open(dest,'w',newline='') as f:
                  w=csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
                  w.writeheader(); w.writerows(rows)
              print('wrote', dest, len(rows))
              return len(rows)
          os.makedirs('/tmp/d1x/csv', exist_ok=True)
          write_csv('/tmp/d1x/pages/hfr_*.json','/tmp/d1x/csv/declared_weight.csv')
          write_csv('/tmp/d1x/pages/helo_*.json','/tmp/d1x/csv/horse_elo_v12.csv')
          write_csv('/tmp/d1x/pages/jelo_*.json','/tmp/d1x/csv/jockey_elo_v12.csv')
          write_csv('/tmp/d1x/pages/telo_*.json','/tmp/d1x/csv/trainer_elo_v12.csv')
          write_csv('/tmp/d1x/pages/races.json','/tmp/d1x/csv/races_track.csv')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-v12-bw-csv
          path: |
            /tmp/d1x/csv
            /tmp/d1x/cov_hfr.json
            /tmp/d1x/cov_rr.json
            /tmp/d1x/track_counts.json
            /tmp/d1x/pragma_hfr.json
          retention-days: 14
